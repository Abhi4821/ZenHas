<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ZenTalk</title>

    <!-- Global theme colors -->
    <link rel="stylesheet" href="./assets/css/theme.css">

    <!-- Common styles -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Registration styles -->
    <link rel="stylesheet" href="./assets/css/register.css">

    <!-- Apply saved theme; no toggle button on this page -->
    <script src="./assets/js/theme.js" defer></script>
</head>

<body>
    <main class="container">
        <div class="card register-card">
            <h2>Create Account</h2>

            <!-- Step 1: Name and email -->
            <section id="emailSection">
                <input id="name" class="input" type="text" placeholder="Full Name" autocomplete="name" required>

                <input id="email" class="input" type="email" placeholder="Email Address" autocomplete="email" required>

                <p id="emailStatus" class="small" aria-live="polite"></p>

                <button id="sendOtp" class="btn btn-outline" type="button" hidden disabled>
                    Send OTP
                </button>

                <p id="loginPrompt" class="small" hidden>
                    This email is already registered.
                    <a href="login.html" class="link">Login here</a>
                </p>
            </section>

            <!-- Step 2: OTP verification -->
            <!-- <section id="otpSection" hidden>
                <p class="small">Enter the OTP sent to your email.</p>

                <input id="otp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                    placeholder="Enter 6-digit OTP">

                <button id="verifyOtp" class="btn" type="button">
                    Verify Email
                </button>
            </section> -->

            <section id="otpSection" hidden>
                <p class="small">Enter the OTP sent to your email.</p>

                <div class="otp-box" id="registerOtpBoxes" role="group" aria-label="6-digit verification code">
                    <input class="otp-digit" id="regOtp1" type="text" inputmode="numeric" maxlength="1"
                        autocomplete="one-time-code" aria-label="Digit 1">
                    <input class="otp-digit" id="regOtp2" type="text" inputmode="numeric" maxlength="1"
                        aria-label="Digit 2">
                    <input class="otp-digit" id="regOtp3" type="text" inputmode="numeric" maxlength="1"
                        aria-label="Digit 3">
                    <input class="otp-digit" id="regOtp4" type="text" inputmode="numeric" maxlength="1"
                        aria-label="Digit 4">
                    <input class="otp-digit" id="regOtp5" type="text" inputmode="numeric" maxlength="1"
                        aria-label="Digit 5">
                    <input class="otp-digit" id="regOtp6" type="text" inputmode="numeric" maxlength="1"
                        aria-label="Digit 6">
                </div>

                <!-- Existing registration JS can continue reading #otp -->
                <input id="otp" type="hidden" value="">

                <button id="verifyOtp" class="btn" type="button">
                    Verify Email
                </button>
            </section>


            <!-- Step 3: Additional details -->
            <section id="detailsSection" hidden>
                <p class="small">Email verified successfully.</p>

                <label for="gender">Gender</label>
                <select id="gender" class="input" required>
                    <option value="">Select Gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                </select>

                <label for="country">Country</label>
                <select id="country" class="input" required>
                    <option value="">Select Country</option>
                </select>

                <label for="state">State</label>
                <select id="state" class="input" disabled required>
                    <option value="">Select State</option>
                </select>

                <label for="city">City</label>
                <select id="city" class="input" disabled required>
                    <option value="">Select City</option>
                </select>

                <button id="registerBtn" class="btn" type="button">
                    Complete Registration
                </button>
            </section>

            <p id="msg" class="small" role="status" aria-live="polite"></p>

            <p class="small">
                Already have an account?
                <a href="login.html" class="link">Login</a>
            </p>
        </div>
    </main>

    <!-- Existing registration logic -->
    <script type="module" src="./assets/js/register.js"></script>
</body>

</html>
