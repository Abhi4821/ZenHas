spring:
  application:
    name: video-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.zentalk.video: INFO
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
